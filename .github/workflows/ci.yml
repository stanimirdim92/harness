# Every deterministic check in this repo, on pushes to main and on pull requests.
#
# These suites cost nothing and run in seconds, and until now they ran only
# when someone remembered. The one suite deliberately absent is
# dotfiles/tools/evals/workflow/run.py: it drives the real model and spends tokens, so
# it stays a manual run (dotfiles/tools/evals/workflow/README.md). Its assertion logic
# is covered here through test_runner.py.
#
# Runner deps: bash, git, jq and python3 are all preinstalled on ubuntu-latest.
# The preflight step fails loudly if that ever stops being true, so a missing
# tool cannot read as a failing test.
name: checks

# Pushes to main, pull requests, and manual runs. Not every branch push: a
# branch later fast-forwarded into main ran the same suite twice on one commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-rescore reads the pushed commit range

      - name: Preflight — required tools
        run: |
          for tool in bash git jq python3; do
            command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
          done
          jq --version && python3 --version && git --version

      # Enforcement: the three PreToolUse hooks, deny/ask/allow, including the
      # alias, typo, global-option and quoted-target bypasses (adr/0049).
      - name: Hooks — deny, ask, and allow cases
        run: bash dotfiles/tools/tests/test-hooks.sh

      # Enforcement: the SubagentStop handoff gate — complete, partial,
      # claim-only, second attempt, unknown agent, unreadable transcript.
      # Writers' commits carry a Refs: trailer (adr/0081).
      - name: Hooks — commit trailers
        run: bash dotfiles/tools/tests/test-commit-trailers.sh
      # /ship's current-base check: merge the base into a scratch worktree
      # and re-run the checks (adr/0095).
      - name: Current-base check
        run: bash dotfiles/tools/tests/test-base-check.sh
      # Paths that always need a person, read from the base branch's REVIEW.md
      # (adr/0096).
      - name: Always-a-person paths
        run: python3 dotfiles/tools/tests/test-always-person.py
      # Instruction lines a change makes untrue: renamed or deleted files and
      # removed scripts (adr/0098).
      - name: Stale instructions
        run: python3 dotfiles/tools/tests/test-stale-instructions.py

      - name: Hooks — handoff report gate
        run: bash dotfiles/tools/tests/test-handoff-hook.sh

      # The formatter hook runs only a formatter the project declares and installs (adr/0107).
      - name: Hooks — project formatter
        run: bash dotfiles/tools/tests/test-format-hook.sh

      # Enforcement: the two worktree-base guards (adr/0057). Real git
      # fixtures -- bare origin, main checkout, linked worktree, feature
      # branch -- because both hooks decide from git state.
      - name: Hooks — worktree base guards
        run: bash dotfiles/tools/tests/test-worktree-hooks.sh

      # Enforcement: the isolated test-runner gate, evidence-gated on the
      # project shipping bin/worktree-test.sh and more than one live worktree.
      - name: Hooks — isolated test runner
        run: bash dotfiles/tools/tests/test-isolated-test-runner.sh

      # Declarations: persona tool grants, writer hook attachment, settings pins.
      - name: Frontmatter and settings pins
        run: |
          python3 dotfiles/tools/checks/validate-frontmatter.py
          python3 dotfiles/tools/tests/validate-frontmatter-test.py

      # Pipeline: canonical spec/plan/todo artifact paths across 25 files.
      - name: Artifact paths
        run: |
          python3 dotfiles/tools/checks/validate-artifact-paths.py
          python3 dotfiles/tools/tests/validate-artifact-paths-test.py

      # Pipeline: every cross-reference between harness files resolves. A stage
      # that cannot read its own reference proceeds from the skill body alone.
      - name: Harness cross-references
        run: |
          python3 dotfiles/tools/checks/check-references.py
          python3 dotfiles/tools/tests/check-references-test.py

      # /review's weakened-test guard: deleted or skipped tests, removed
      # assertions, suppressions, checker config and stubs (adr/0078).
      - name: Weakened-test guard
        run: python3 dotfiles/tools/tests/test-weakened-tests.py

      # /spec and /plan check their own output: spec shape, and a plan that
      # covers its spec with complete packets (adr/0081). /review and /ship
      # check that spec, plan, todo and open items still agree (adr/0088).
      - name: Spec and plan checks
        run: |
          python3 dotfiles/tools/tests/test-check-spec.py
          python3 dotfiles/tools/tests/test-check-plan.py
          python3 dotfiles/tools/tests/test-check-ledger.py

      # Writing rule: ADRs from 0073 on keep long sentences (over 25 words) to
      # 20% or less (dotfiles/claude/AGENTS.md "Writing for humans", adr/0077).
      - name: Writing rule
        run: |
          python3 dotfiles/tools/checks/check-writing.py
          python3 dotfiles/tools/tests/check-writing-test.py

      # The harness map is generated from the sources it describes; a change
      # to a persona, hook, command, skill, reference or CI step that did not
      # regenerate it fails here (adr/0069).
      - name: Harness map is current
        run: python3 dotfiles/tools/checks/harness-map.py --check

      # Spec eval: the judging half only. Producing a spec drives the real
      # model and stays manual.
      - name: Spec-eval judging logic
        working-directory: dotfiles/tools/evals/spec-eval
        run: |
          python3 test_judge.py
          python3 test_produce.py

      # Plan-localization recall scoring (adr/0067). Scoring a real ticket
      # needs its project checkout and stays manual.
      - name: Plan-recall scoring logic
        working-directory: dotfiles/tools/evals/plan-recall
        run: python3 test_recall.py
      # Review eval: case building and judging (adr/0093). Producing runs the
      # real /review and stays manual.
      - name: Review eval
        working-directory: dotfiles/tools/evals/review-eval
        run: python3 test_review_eval.py
      # A reviewer change says how the review eval scored it (adr/0111).
      - name: Reviewer changes carry a rescore
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 dotfiles/tools/tests/test-check-rescore.py
          if [ -n "$BASE" ]; then range="$BASE..HEAD"; elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"; else exit 0; fi
          python3 dotfiles/tools/checks/check-rescore.py --range "$range"

      # How review findings ended, per reviewer, and which classes repeat (adr/0093, adr/0105).
      - name: Review noise count
        run: python3 dotfiles/tools/tests/test-review-noise.py

      # Orchestration: the workflow runner's own assertion and fixture logic.
      # NOT the live cases — those spend tokens and stay manual.
      - name: Workflow runner logic
        working-directory: dotfiles/tools/evals/workflow
        run: python3 -m unittest -q test_runner

      # Installation: preflight conflict detection and injected-failure rollback.
      - name: Codex skill installer
        run: python3 dotfiles/tools/tests/test-install-skills.py

      - name: Codex native roles and hook adapters
        run: python3 dotfiles/tools/tests/test-codex-harness.py
      # The committed Codex config holds harness settings only; the app's
      # projects, desktop state and hook trust stay in the local file (adr/0086).
      - name: Codex config base holds no machine state
        run: python3 dotfiles/codex/install-config.py --lint

      - name: Codex CLI ticket worktrees and concurrent sessions
        run: python3 dotfiles/tools/tests/test-codex-worktree.py

      # The dotfile linker's confirmation gate, against a throwaway $HOME.
      - name: Dotfile linker confirmation
        run: bash dotfiles/tools/tests/test-link-dotfiles.sh

      # The Figma skill fetch refuses a file whose hash differs from the pin.
      - name: Figma skill fetch
        run: bash dotfiles/tools/tests/test-fetch-figma-skill.sh

      # The batch spec runner's decisions, with `claude` stubbed.
      - name: Batch spec runner
        run: bash dotfiles/tools/tests/test-batch-spec.sh

      # The overnight fixer: round cap, moved candidate, nothing open (adr/0108).
      - name: Batch fix runner
        run: python3 dotfiles/tools/tests/test-batch-fix.py

      # Measurement: the transcript metrics' large-result section.
      - name: Run metrics
        run: bash dotfiles/tools/tests/test-run-metrics.sh
