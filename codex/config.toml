# The harness's Codex settings, and nothing else. install-config.py merges
# them into ~/.codex/config.toml, which stays a local file: the Codex app
# writes trusted projects, desktop preferences, plugins and hook trust there,
# and none of that belongs in this public repository (ADR 0086).
sandbox_mode = "workspace-write"
model = "gpt-6-astra"
model_reasoning_effort = "high"
personality = "pragmatic"
approval_policy = "on-request"
# A person answers escalation requests, not a reviewer model (ADR 0086).
approvals_reviewer = "user"
service_tier = "default"

# Writes are confined to the workspace, with .git/.agents/.codex read-only
# inside it; anything outside needs an approval, so escalation is per task
# rather than granted once for every session. Network stays on: npx, composer,
# the remote MCP servers and mcp-remote all need it, and turning it off trades
# a boundary Codex already enforces for a stream of approvals.
[sandbox_workspace_write]
network_access = true

[features]
js_repl = false
memories = true

[memories]
generate_memories = true
use_memories = true

[mcp_servers.phpstorm]
url = "http://127.0.0.1:64443/stream"

# Pinned: npx -y runs whatever version is current when Codex starts.
[mcp_servers.atlassian]
command = "npx"
args = ["-y", "mcp-remote@0.14.3", "https://mcp.atlassian.com/v1/mcp/authv2"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.10.1", "--isolated"]
