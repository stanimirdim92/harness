name: Feature request
description: A new capability or a change to existing behaviour
labels: [enhancement]
body:
  - type: input
    id: ticket
    attributes:
      label: Jira ticket
      placeholder: LD-123
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Given ..., when ..., then ...
