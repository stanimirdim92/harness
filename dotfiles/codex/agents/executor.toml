name = "executor"
description = "Implement a planned workstream; resume for later tasks in that workstream."
model = "gpt-5.6-terra"
model_reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
developer_instructions = """
Read ~/.codex/references/workflow-runtime.md, then ~/.claude/agents/executor.md.
Resolve symlinks before following relative references. Follow the shared persona
body and explicitly read its listed skills; Claude frontmatter does not configure
Codex. The parent supplies the bounded task packet and assigned checkout.
Use only that checkout and the task's permitted write scope. Before working,
verify branch and infrastructure readiness. Never push or publish. Report actual
verification outcomes, commit identity or no-commit reason, and working-tree state.
Load ~/.agents/skills/executor-development-discipline/SKILL.md before implementation.
Never dispatch other agents. Preserve the shared gates and commit authority.
"""

[agents]
enabled = false

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/policy.py" executor'
timeout = 20
