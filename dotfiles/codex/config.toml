# The harness's Codex settings, and nothing else. install-config.py merges
# them into ~/.codex/config.toml, which stays a local file: the Codex app
# writes trusted projects, desktop preferences, plugins and hook trust there,
# and none of that belongs in this public repository (ADR 0086).
sandbox_mode = "workspace-write"
model = "gpt-6-astra"
model_reasoning_effort = "high"
personality = "pragmatic"
approval_policy = "on-request"
# A person answers escalation requests, not a reviewer model (ADR 0086).
approvals_reviewer = "user"
service_tier = "default"

# Writes are confined to the workspace, with .git/.agents/.codex read-only
# inside it; anything outside needs an approval, so escalation is per task
# rather than granted once for every session. Network stays on: npx, composer,
# the remote MCP servers and mcp-remote all need it, and turning it off trades
# a boundary Codex already enforces for a stream of approvals.
[sandbox_workspace_write]
network_access = true

[features]
js_repl = false
memories = true

[memories]
generate_memories = true
use_memories = true

[mcp_servers.phpstorm]
url = "http://127.0.0.1:64443/stream"

# Pinned: npx -y runs whatever version is current when Codex starts.
[mcp_servers.atlassian]
command = "npx"
args = ["-y", "mcp-remote@0.14.3", "https://mcp.atlassian.com/v1/mcp/authv2"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.10.1", "--isolated"]

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/stanimir/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
CODEX_HOME = "/home/stanimir/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.1002.52244"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/stanimir/.codex/plugins/cache/openai-bundled/browser/26.1002.52244/scripts/browser-service.mjs"}'
CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

[desktop]
followUpQueueMode = "queue"

[marketplaces.openai-bundled]
source_type = "local"
source = "/home/stanimir/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/home/stanimir/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
