sandbox_mode = "workspace-write"
model = "gpt-6-astra"
model_reasoning_effort = "high"
personality = "pragmatic"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
service_tier = "default"

# Writes are confined to the workspace, with .git/.agents/.codex read-only
# inside it; anything outside needs an approval, so escalation is per task
# rather than granted once for every session. Network stays on: npx, composer,
# the remote MCP servers and mcp-remote all need it, and turning it off trades
# a boundary Codex already enforces for a stream of approvals.
[sandbox_workspace_write]
network_access = true

[mcp_servers.phpstorm]
url = "http://127.0.0.1:64443/stream"

[mcp_servers.atlassian]
command = "npx"
args = ["-y", "mcp-remote", "https://mcp.atlassian.com/v1/mcp/authv2"]

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/stanimir/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
CODEX_HOME = "/home/stanimir/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.917.61114"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/stanimir/.codex/plugins/cache/openai-bundled/browser/26.917.61114/scripts/browser-service.mjs"}'
CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--isolated"]

[marketplaces.openai-bundled]
source_type = "local"
source = "/home/stanimir/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
